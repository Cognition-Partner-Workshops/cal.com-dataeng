name: SafeGuard Insurance CI

on:
  push:
    branches: [main, 'devin/**']
    paths:
      - 'insurance-claims-system/**'
  pull_request:
    branches: [main]
    paths:
      - 'insurance-claims-system/**'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance-claims-system/backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safeguard_insurance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safeguard_insurance_test
      JWT_SECRET: test-jwt-secret-key-min-32-chars-long-here-ci
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-min-32-chars-ci
      JWT_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
      PORT: 3001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: insurance-claims-system/backend/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance-claims-system/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: insurance-claims-system/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --passWithNoTests
      - run: npm run lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance-claims-system/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: insurance-claims-system/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
